# Classic PHP Network Weathermap 0.98a test fixture
WIDTH 1200
HEIGHT 720
BGCOLOR 15 23 42
TITLE Core Backbone Network
TITLEPOS 24 32
TIMEPOS 24 56
KEYPOS DEFAULT 30 500 "Backbone Load"
KEYSTYLE DEFAULT classic
HTMLSTYLE overlib
BACKGROUND images/dc-floorplan.png
SET rrd_period 1100

SCALE DEFAULT 0 0     192 192 192
SCALE DEFAULT 0 50    0 200 0    255 255 0
SCALE DEFAULT 50 100  255 255 0  255 0 0

NODE DEFAULT
    LABELOFFSET S
    ICON 80 40 round

NODE core1
    LABEL "Core Router 1"
    POSITION 220 260
    INFOURL /device/device=10/

NODE core2
    LABEL "Core Router 2"
    POSITION core1 +560 +40
    INFOURL /device/device=11/

LINK DEFAULT
    WIDTH 8
    ARROWSTYLE compact
    BWLABEL bits

LINK core1-core2-lag
    NODES core1:E core2:W
    VIA 500 180
    VIASTYLE curved
    BANDWIDTH 20G
    TARGET ./core1/port-id42.rrd:INOCTETS:OUTOCTETS ./core1/port-id43.rrd:INOCTETS:OUTOCTETS
    OVERLIBGRAPH /graph.php?id=42&type=port_bits
    INFOURL /device/device=10/tab=port/port=42/

LINK core1-core2-backup
    NODES core1:S core2:S
    VIA 500 420
    VIASTYLE angled
    BANDWIDTH 1G
    TARGET static:250000000:120000000 !/usr/local/bin/unsafe.sh snmp:public:10.0.0.1:1.3.6.1.2.1.2.2.1.10.1:1.3.6.1.2.1.2.2.1.16.1
