name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify pre-built dist bundle matches source
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
          git diff --exit-code dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Notify Packagist (optional)
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_USERNAME" ] && [ -n "$PACKAGIST_API_TOKEN" ]; then
            curl -fsS -X POST "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d '{"repository":{"url":"https://github.com/BadRush/weathermap-v2"}}'
          else
            echo "Skipping Packagist API notification (PACKAGIST_USERNAME/PACKAGIST_API_TOKEN not set; use Packagist GitHub App or configure secrets)."
          fi
